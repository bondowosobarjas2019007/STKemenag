<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiTugas Kemenag Jember — Generator Surat Tugas ASN</title>
    <meta
      name="description"
      content="Aplikasi generator Surat Tugas resmi PNS dan ASN Kantor Kementerian Agama Kabupaten Jember dengan format berangkat sendiri, 3 orang, dan terlampir (>3 orang)."
    />
    <meta property="og:title" content="SiTugas Kemenag Jember — Generator Surat Tugas ASN" />
    <meta
      property="og:description"
      content="Generator Surat Tugas resmi Kantor Kementerian Agama Kabupaten Jember dengan pratinjau A4 langsung, cetak PDF, dan ekspor Word (.docx)."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('stkemenag_theme_mode');
          var root = document.documentElement;
          root.classList.remove('dark', 'theme-night');
          if (mode === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else if (mode === 'night') {
            root.classList.add('theme-night');
            root.setAttribute('data-theme', 'night');
          } else {
            root.setAttribute('data-theme', 'normal');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
